[project]
authors = [
    { name = "Misael Gonzalez (Rayference)" },
    { name = "Nicolae Marton (Rayference)" },
]
description = "Common shared components for the ESA DTE-S2GOS service (scene descriptions, materials, I/O utilities)."
name = "s2gos-utils"
requires-python = ">=3.10,<3.13"
version = "0.0.1"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "numpy>=1.24.0",
    "fsspec>=2023.1.0",
    "pandas>=1.5.0",
    "xarray>=2023.1.0,<2025",
    "geopandas>=0.13.0",
    "pyarrow>=10.0.0",
    "attrs>=22.0.0",
    "universal-pathlib>=0.2.0",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
jupyter = ">=1.1.1,<2"
jupyterlab = ">=4.4.3,<5"
ipykernel = ">=6.29.5,<7"
ruff = "*"

[tool.pixi.pypi-dependencies]
s2gos_utils = { path = ".", editable = true }

[tool.pixi.tasks]
notebook = "jupyter notebook"
lab = "jupyter lab"

[project.optional-dependencies]
test = ["pytest"]
dev = []
docs = ["mkdocs"]

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev", "test", "docs"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
ignore = ["E501", "F821"]
isort = { relative-imports-order = "closest-to-furthest" }
per-file-ignores = { "*.ipynb" = ["E402"] }
select = ["I", "F", "E"]